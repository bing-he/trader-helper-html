<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Same-County NG Spread Monitor</title>
  <style>
    :root {
      --bg: #f3efe8;
      --panel: #fbf8f3;
      --ink: #1a262b;
      --muted: #5d6a6f;
      --line: #d8cfc1;
      --accent: #0f766e;
      --accent-soft: #d8f1ed;
      --warn: #b45309;
      --warn-soft: #faedd8;
      --danger: #991b1b;
      --danger-soft: #fee2e2;
      --shadow: 0 18px 40px rgba(44, 40, 30, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at top right, rgba(15, 118, 110, 0.10), rgba(15, 118, 110, 0) 28%),
        linear-gradient(180deg, #f8f4ee 0%, var(--bg) 100%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    .page {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .hero {
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.10), rgba(180, 83, 9, 0.08)),
        var(--panel);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.05;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-value {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 700;
    }
    .controls {
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(240px, 1.8fr) minmax(150px, 0.8fr) minmax(150px, 0.8fr) minmax(190px, 0.9fr);
      align-items: center;
    }
    input, select {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 11px 12px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }
    label.check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    label.check input { width: auto; }
    .results-note {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .table-wrap {
      overflow: auto;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      background: #f7f3ed;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      z-index: 1;
    }
    td.numeric {
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .pair-label {
      font-size: 14px;
      font-weight: 700;
    }
    .pair-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .pair-links {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      background: #f9fafb;
      color: var(--ink);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge.widening { border-color: #ef4444; background: #fee2e2; color: #7f1d1d; }
    .badge.compressing { border-color: #0f766e; background: #d8f1ed; color: #064e3b; }
    .badge.flat { border-color: #94a3b8; background: #f1f5f9; color: #334155; }
    .badge.choppy { border-color: var(--warn); background: var(--warn-soft); color: #7c2d12; }
    .badge.insufficient { border-color: #cbd5e1; background: #f8fafc; color: var(--muted); }
    .badge.stale { border-color: var(--warn); background: var(--warn-soft); color: #7c2d12; }
    .badge.current { border-color: #0f766e; background: #d8f1ed; color: #064e3b; }
    .county-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .county-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      border: 1px solid #afd8d1;
      font-size: 12px;
    }
    .empty-note {
      padding: 20px 0;
      color: var(--muted);
      font-size: 14px;
    }
    @media (max-width: 960px) {
      .page { padding: 16px; }
      .summary { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .results-note { text-align: left; }
    }
  </style>
</head>

      <div id="tableWrap" class="table-wrap" style="margin-top: 14px;"></div>
    </section>
  </div>

const rows = DATA.rows || [];
const searchBox = document.getElementById("searchBox");
const regionFilter = document.getElementById("regionFilter");
const trendFilter = document.getElementById("trendFilter");
const sortSelect = document.getElementById("sortSelect");
const tableWrap = document.getElementById("tableWrap");
const resultsNote = document.getElementById("resultsNote");
const pairCount = document.getElementById("pairCount");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[char]));
}

function formatNumber(value, digits) {
  if (value === null || value === undefined || Number.isNaN(value)) return "n/a";
  return Number(value).toFixed(digits);
}

function signedNumber(value, digits) {
  if (value === null || value === undefined || Number.isNaN(value)) return "n/a";
  const number = Number(value);
  return (number > 0 ? "+" : "") + number.toFixed(digits);
}

function trendClass(value) {
  return String(value || "Insufficient").toLowerCase().replace(/[^a-z0-9]+/g, "-");
}

function explorerHref(key) {
  if (!key) return null;
  return String(DATA.explorerPage || "mapper_component_explorer.html") + "#" + encodeURIComponent(key);
}

function populateRegionFilter() {
  const regions = (DATA.regions || []).filter(Boolean);
  let html = '<option value="">All regions</option>';
  for (const region of regions) {
    html += '<option value="' + escapeHtml(region) + '">' + escapeHtml(region) + '</option>';
  }
  regionFilter.innerHTML = html;
}

function filteredRows() {
  const filter = (searchBox.value || "").trim().toLowerCase();
  const region = regionFilter.value || "";
  const trend = trendFilter.value || "";
  return rows.filter((row) => {
    if (filter && !(row.search_blob || "").includes(filter)) return false;
    if (region && row.region !== region && row.region_a !== region && row.region_b !== region) return false;
    if (trend && row.trend !== trend) return false;
    return true;
  });
}

function sortedRows(items) {
  const sortKey = sortSelect.value || "thirty_day_change";
  const copy = [...items];
  copy.sort((left, right) => {
    if (sortKey === "region") {
      return String(left.region || "").localeCompare(String(right.region || "")) ||
        String(left.pair_label || "").localeCompare(String(right.pair_label || ""));
    }
    if (sortKey === "pair") {
      return String(left.pair_label || "").localeCompare(String(right.pair_label || ""));
    }
    const leftValue = sortKey === "thirty_day_change"
      ? Math.abs(Number(left.thirty_day_change ?? 0))
      : Number(left[sortKey] ?? -Infinity);
    const rightValue = sortKey === "thirty_day_change"
      ? Math.abs(Number(right.thirty_day_change ?? 0))
      : Number(right[sortKey] ?? -Infinity);
    return (rightValue - leftValue) ||
      Number(right.current_5d_avg ?? -Infinity) - Number(left.current_5d_avg ?? -Infinity) ||
      String(left.pair_label || "").localeCompare(String(right.pair_label || ""));
  });
  return copy;
}

function renderRows() {
  const visibleRows = sortedRows(filteredRows());
  pairCount.textContent = String(visibleRows.length);
  resultsNote.textContent = visibleRows.length + " pair groups shown";
  if (!visibleRows.length) {
    tableWrap.innerHTML = '<div class="empty-note">No pair groups match the current search.</div>';
    return;
  }
  let html = '<table><thead><tr><th>Pair</th><th>Region</th><th>Current 5D Avg</th><th>Prior 30D Avg</th><th>30D Change</th><th>Trend</th><th>Counties</th></tr></thead><tbody>';
  for (const row of visibleRows) {
    const countiesHtml = (row.counties || []).map((label) => '<span class="county-pill">' + escapeHtml(label) + '</span>').join('');
    const hrefA = explorerHref(row.explorer_key_a);
    const hrefB = explorerHref(row.explorer_key_b);
    const links = [
      hrefA ? '<a href="' + escapeHtml(hrefA) + '">Open ' + escapeHtml(row.component_a) + '</a>' : '',
      hrefB ? '<a href="' + escapeHtml(hrefB) + '">Open ' + escapeHtml(row.component_b) + '</a>' : ''
    ].filter(Boolean).join('');
    html += '<tr>' +
      '<td><div class="pair-label">' + escapeHtml(row.pair_label) + '</div><div class="pair-meta">' + escapeHtml(row.component_a) + ' | ' + escapeHtml(row.component_b) + '</div><div class="pair-links">' + links + '</div></td>' +
      '<td>' + escapeHtml(row.region || 'Unknown') + '</td>' +
      '<td class="numeric">' + formatNumber(row.current_5d_avg, 4) + '</td>' +
      '<td class="numeric">' + formatNumber(row.prior_30d_avg, 4) + '</td>' +
      '<td class="numeric">' + signedNumber(row.thirty_day_change, 4) + '</td>' +
      '<td><span class="badge ' + trendClass(row.trend) + '">' + escapeHtml(row.trend || 'Insufficient') + '</span></td>' +
      '<td><div class="county-list">' + countiesHtml + '</div></td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  tableWrap.innerHTML = html;
}

populateRegionFilter();
for (const element of [searchBox, regionFilter, trendFilter, sortSelect]) {
  element.addEventListener("input", renderRows);
  element.addEventListener("change", renderRows);
}
renderRows();
  </script>
